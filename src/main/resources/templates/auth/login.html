<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вход')}"></head>
<body>
<div class="auth-wrap">
  <form class="panel auth-card" th:action="@{/login}" method="post" aria-labelledby="loginTitle">
    <a class="logo" th:href="@{/}" style="padding:0"><span class="logo-mark">F</span><span class="logo-name">FinTrack</span></a>
    <h1 id="loginTitle">Вход</h1>
    <div class="status ok" th:if="${infoMessage}"><b th:text="${infoMessage}">Аккаунт создан, войдите</b></div>
    <div class="status warn" th:if="${errorMessage}" role="alert"><b th:text="${errorMessage}">Неверный e-mail или пароль</b></div>
    <label class="field">E-mail<input type="email" name="email" autocomplete="username" required autofocus></label>
    <label class="field">Пароль<input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit" class="btn primary">Войти</button>
    <p class="sub">Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></p>
  </form>
</div>
</body>
</html>
