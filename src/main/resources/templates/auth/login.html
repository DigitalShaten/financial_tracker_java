<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
<h2>Вход в FinTrack</h2>
<form th:action="@{/login}" method="post">
    <div>
        <label>Email:</label>
        <input type="email" name="email" required/>
    </div>
    <div>
        <label>Пароль:</label>
        <input type="password" name="password" required/>
    </div>
    <button type="submit">Войти</button>
</form>
<p><a th:href="@{/register}">Зарегистрироваться</a></p>
</body>
</html>
