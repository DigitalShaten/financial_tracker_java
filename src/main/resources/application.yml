spring:
  application:
    name: fintrack
  config:
    # при запуске из IDE переменные берутся из .env в корне проекта (в Docker их передаёт compose)
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  web:
    locale: ru
    locale-resolver: fixed

app:
  admin:
    email: ${ADMIN_EMAIL:admin@fintrack.local}
    password: ${ADMIN_PASSWORD:admin12345}

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:false}
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:Fin_track_mega_bot}

management:
  endpoints:
    web:
      exposure:
        include: health,info
