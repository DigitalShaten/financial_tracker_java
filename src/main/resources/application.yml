spring:
  application:
    name: fintrack
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  web:
    locale: ru
    locale-resolver: fixed

app:
  admin:
    email: ${ADMIN_EMAIL:admin@fintrack.local}
    password: ${ADMIN_PASSWORD:admin12345}

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:false}
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:Fin_track_mega_bot}

management:
  endpoints:
    web:
      exposure:
        include: health,info
